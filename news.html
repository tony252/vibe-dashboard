ck/c/2026-11-05/doc-inixrumy8876456.shtml","importance":""},{"id":"xq4908415","time":1793835125000,"title":"【高通股价盘后大跌 供应成本侵蚀利润】高通股价在盘后交易中大跌，此前该公司给出了平淡的盈利预测，显示这家全球最大智能手机处理器制造商仍在艰难应对零部件价格上涨的...","text":"【高通股价盘后大跌 供应成本侵蚀利润】高通股价在盘后交易中大跌，此前该公司给出了平淡的盈利预测，显示这家全球最大智能手机处理器制造商仍在艰难应对零部件价格上涨的问题。该公司周三在一份声明中称，截至12月的三个月，每股收益预计为2.15-2.35美元。该预测区间的中点低于分析师平均预估的2.32美元。发布预测时，高通提到了零部件和制造成本的“全面上涨”。与许多芯片制造商一样，该公司也面临因自身供应链短板和内存芯片紧缺而导致的成本上升 —— 这在很大程度上是由于数据中心设备需求激增所致。为应对这一困境，高通正在上调自身产品价格。黯淡的每股收益预测盖过了进军新市场提振下强劲的季度营收预测。高通表示，该季度营收预计在104亿-112亿美元，分析师的预估为105.5亿美元。上述消息公布后，高通股价在盘后交易中下跌约7%。截至收盘，该股今年以来累计上涨1.3%。值得欣慰的是，来自汽车和数据中心设备制造商的需求正在帮助弥补智能手机市场放缓带来的影响。手机供应商仍是高通最大的客户，但面对内存芯片及其他零部件价格飙升，它们已缩减了产量。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/415578234","importance":"hot"},{"id":"xq4908416","time":1793835122000,"title":"【A股限售股解禁一览：5.9亿元市值限售股今日解禁】Wind数据显示，周四（11月5日），共有7家公司限售股解禁，合计解禁量为1623.92万股，按最新收盘价计...","text":"【A股限售股解禁一览：5.9亿元市值限售股今日解禁】Wind数据显示，周四（11月5日），共有7家公司限售股解禁，合计解禁量为1623.92万股，按最新收盘价计算，合计解禁市值为5.9亿元。从解禁量来看，维琪科技、三友医疗、寒锐钴业解禁量居前，解禁股数分别为1174.6万股、253.5万股、111.71万股。从解禁市值来看，维琪科技、三友医疗、寒锐钴业解禁市值居前，解禁市值分别为5.14亿元、3095.18万元、2686.59万元。从解禁股数占总股本比例来看，维琪科技、三友医疗、亚华电子解禁比例居前，解禁比例分别为19.97%、0.69%、0.5%。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/415578235","importance":""},{"id":"1632470192471","time":1793835088000,"title":"被年轻人抛弃的茅台，削藩！","text":"被年轻人抛弃的茅台，削藩！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/LAV2CSU20519S08H.html","importance":""},{"id":"sinacomos:nixruna5650909","time":1793835070000,"title":"高通股价盘后大跌 供应成本侵蚀利润","text":" 高通股价在盘后交易中大跌，此前该公司给出了平淡的盈利预测，显示这家全球最大智能手机处理器制造商仍在艰难应对零部件价格上涨的问题。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-11-05/doc-inixruna5650909.shtml","importance":"hot"},{"id":"sinacomos:nixrqen6349911","time":1793834934000,"title":"阿斯利康据悉出价约100亿美元收购肥胖症药物开发商Rhythm","text":" 据知情人士透露，英国制药巨头阿斯利康（AstraZeneca）已提出以约100亿美元的价格收购肥胖症药物制造商Rhythm Ph
